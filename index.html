<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-box {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease-in-out;
        }

        .login-box:hover {
            transform: translateY(-3px);
        }

        .login-box h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="app.css?v=2">
</head>
<body class="login-page">

<div class="login-box">
    <h2>Giriş Yap</h2>
    <p class="error" id="error-msg"></p>

    <form id="login-form">
        <label for="kullanici">Kullanıcı Adı</label>
        <input type="text" name="kullanici" id="kullanici" required>

        <label for="sifre">Şifre</label>
        <input type="password" name="sifre" id="sifre" required>

        <button type="submit">Giriş Yap</button>
    </form>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();

    const kullanici = document.getElementById("kullanici").value;
    const sifre = document.getElementById("sifre").value;
    const errorMsg = document.getElementById("error-msg");

    fetch("logine.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `kullanici=${encodeURIComponent(kullanici)}&sifre=${encodeURIComponent(sifre)}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            window.location.href = "index.php";
        } else {
            errorMsg.textContent = data.message;
        }
    })
    .catch(error => {
        errorMsg.textContent = "Bir hata oluştu.";
        console.error("Hata:", error);
    });
});
</script>

</body>
</html>
