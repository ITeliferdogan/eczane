<body>

<nav>
    <a href="index.php">Ana Sayfa</a>
    <a href="hasta.html">Hasta Yönetimi</a>

<script src="app.js"></script>

<div class="container">
    <h3>Yeni Hasta Ekle</h3>
    <input type="text" id="ad" placeholder="Ad">
    <input type="text" id="soyad" placeholder="Soyad">
    <input type="text" id="telefon" placeholder="Telefon">
    <input type="text" id="hastatc" placeholder="TC Kimlik">
    <button id="hastaEkle">Hasta Ekle</button>

    <h3>Hasta Ara</h3>
    <input type="text" id="arama" placeholder="İsim veya TC ile ara...">

    <button id="listele">Tüm Hastaları Göster</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Ad</th>
                <th>Soyad</th>
                <th>Telefon</th>
                <th>TC Kimlik</th>
            </tr>
        </thead>
        <tbody id="hastalar">
            <!-- Hasta kayıtları buraya gelecek -->
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Hasta listeleme fonksiyonu
    function hastaListele(filtre = '') {
        $.post("hasta.php", {islem:"listele", arama: filtre}, function(data){
            let satir = '';
            data = JSON.parse(data);
            data.forEach(function(h){
                satir += `<tr>
                            <td>${h.idhasta}</td>
                            <td>${h.ad}</td>
                            <td>${h.soyad}</td>
                            <td>${h.telefon}</td>
                            <td>${h.hastatc}</td>
                          </tr>`;
            });
            $("#hastalar").html(satir);
        });
    }

    // İlk sayfa yüklemesinde tüm hastaları getir
    hastaListele();

    // Tüm hastaları göster butonu
    $("#listele").click(function(){
        $("#arama").val('');
        hastaListele();
    });

    // Hasta ekleme işlemi
    $("#hastaEkle").click(function(){
        $.post("hasta.php", {
            islem: "ekle",
            ad: $("#ad").val(),
            soyad: $("#soyad").val(),
            telefon: $("#telefon").val(),
            hastatc: $("#hastatc").val()
        }, function(response){
            alert(response);
            $("#ad, #soyad, #telefon, #hastatc").val('');
            hastaListele();
        });
    });

    // Arama kutusuna her yazışta filtreleme yap
    $("#arama").keyup(function(){
        let arama = $(this).val();
        hastaListele(arama);
    });
</script>

</body>
