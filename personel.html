<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Personel Yönetimi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            margin: 0; padding: 0;
        }
        nav {
            background-color: #34495e;
            padding: 15px; text-align: center;
        }
        nav a {
            color: #fff; margin: 0 15px; text-decoration: none;
            font-weight: bold;
        }
        .container {
            width: 850px; margin: 20px auto;
            padding: 15px; background: #fff;
            border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.1);
        }
        input, button {
            padding: 7px; width: 90%; margin-bottom: 8px; box-sizing: border-box;
        }
        button {
            width: 94%; background-color: #f39c12; color: white;
            border: none; cursor: pointer; border-radius: 4px;
        }
        button:hover {
            background-color: #e67e22;
        }
        table {
            width: 100%; border-collapse: collapse; margin-top: 15px;
        }
        th, td {
            padding: 8px; border-bottom: 1px solid #ddd; text-align: center;
        }
        th {
            background-color: #f39c12; color: white;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="hasta.html">Hasta Yönetimi</a>
    <a href="ilacstok.html">İlaç Stok Yönetimi</a>
    <a href="recete.html">Reçete Yönetimi</a>
    <a href="kasa.html">Kasa Yönetimi</a>
    <a href="personel.html">Personel Yönetimi</a>
    <a href="tedarik.html">Tedarikçiler</a>
</nav>

<div class="container">

    <h3>Yeni Personel Ekle</h3>
    <input type="text" id="ad" placeholder="Ad">
    <input type="text" id="soyad" placeholder="Soyad">
    <input type="text" id="telefon" placeholder="Telefon">
    <button id="personelEkle">Personel Ekle</button>

    <h3>Personel Ara</h3>
    <input type="text" id="arama" placeholder="İsim veya telefon ile ara...">
    <button id="listele">Tüm Personelleri Göster</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Ad</th>
                <th>Soyad</th>
                <th>Telefon</th>
            </tr>
        </thead>
        <tbody id="personeller"></tbody>
    </table>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
function personelListele(filtre=''){
    $.post("personel.php", {islem:"listele", arama:filtre}, function(data){
        let satir='';
        data=JSON.parse(data);
        data.forEach(p=>{
            satir+=`<tr>
            <td>${p.idpersonel}</td>
            <td>${p.ad}</td>
            <td>${p.soyad}</td>
            <td>${p.telefon}</td>
            </tr>`;
        });
        $("#personeller").html(satir);
    });
}

$("#personelEkle").click(function(){
    $.post("personel.php",{
        islem:"ekle",
        ad:$("#ad").val(),
        soyad:$("#soyad").val(),
        telefon:$("#telefon").val()
    },function(response){
        alert(response);
        $("#ad, #soyad, #telefon").val('');
        personelListele();
    });
});

$("#arama").keyup(function(){
    personelListele($(this).val());
});

$("#listele").click(function(){
    $("#arama").val('');
    personelListele();
});

$(document).ready(function(){
    personelListele();
});
</script>

</body>
</html>
